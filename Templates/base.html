<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{% block title %}Flask Date App{% endblock %}</title>
    <!-- Main stylesheet (put here so all pages inherit it) -->
    <link
      rel="stylesheet"
      href="{{url_for('static', filename='Styles/style.css')}}"
    />
    <!-- Extra head content can be added by child templates -->
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <!-- Site header (shared) -->
    <header>
      <h1>Ben's Site</h1>
    </header>
    <!-- Page-specific content will go here -->
    <main>{% block content %} {% endblock %}</main>
    <!-- Shared footer -->
    <footer>
<a href="{{url_for('birdPage')}}">
  <p>Bird Page</p>
</a>
<a href="{{url_for('seasonsPage')}}">
  <p>Seasons Page</p>
</a>
<a href="{{url_for('timePage')}}">
        <p>Time Page</p>
    </a>
</a>
<a href="{{url_for('randomPage')}}">
        <p>Random Number Page</p>
</a>
        <a href="{{url_for('home')}}">
        <p>Home</p>
</a>
</a>
        <a href="{{url_for('profilePage')}}">
        <p>Profile Form</p>
</a>

    </footer>
  </body>
</html>
