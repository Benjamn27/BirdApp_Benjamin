{% extends "base.html" %} {% block content %}

<h2>Feedback Form</h2>

<form method="POST">
  <div class="mb-3">
    <label for="rating" class="form-label">Rate the event:</label>
    <input
      type="number"
      class="form-control"
      id="rating"
      name="rating"
      min="1"
      max="5"
      aria-describedby="ratingHelp"
      required
    />
    <div id="ratingHelp" class="form-text">Please choose a number 1-5</div>
  </div>
  <div class="mb-3">
    <label for="feedback" class="form-label">Your feedback</label>
    <textarea
      class="form-control"
      name="feedback"
      id="feedback"
      rows="4"
      placeholder="Tell us what you thought"
    ></textarea>
  </div>
  <button type="submit" class="btn-solid theme-primary">Submit</button>
</form>

{% endblock %}
